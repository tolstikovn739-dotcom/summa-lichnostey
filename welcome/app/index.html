<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#071534"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><title>Сумма Личностей — настоящие функции, демо-данные</title><link rel="icon" href="../assets/brand.svg"><link rel="stylesheet" href="./fonts.css?v=2"><link rel="stylesheet" href="./native.css?v=2"><link rel="stylesheet" href="./adapter.css?v=2"><script defer src="./native.js?v=2"></script><script defer src="./demo.js?v=2"></script></head><body>
<div class="native-frame-label">Демо-аккаунт · изменения только здесь</div>
<header class="native-header"><img src="../assets/brand.svg" alt="" width="34" height="34"><b>СУММА<br>ЛИЧНОСТЕЙ</b><small>Реальные функции<br>приложения</small></header>
<main class="native-main" id="native-feed"><h1 class="native-title">ПОСТЫ КОМАНДЫ</h1><div class="native-feed-tabs" id="xTabs"><button class="on" onclick="setFeedTab('foryou')">Для вас</button><button onclick="setFeedTab('top')">Популярное</button><button onclick="setFeedTab('media')">Фото</button><div id="xInk"></div></div><div id="xTagChip" hidden></div><div id="newsFeedContainer"></div></main>
<nav class="native-tabs" aria-label="Разделы приложения"><button data-native-screen="feed" aria-selected="true"><span>▤</span>Посты</button><button data-native-screen="cards" aria-selected="false"><span>🃏</span>Карточки</button><button data-native-screen="profile" aria-selected="false"><span>👤</span>Профиль</button></nav>
<div id="fullPostModal" class="fixed inset-0 z-50 hidden items-center justify-center p-2.5 bg-dc-950/90 backdrop-blur-xl">
        <div class="glass-panel max-w-lg w-full rounded-3xl border-2 border-neon-pink/60 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-4 py-3 bg-dc-950/90 border-b border-white/15 flex items-center justify-between gap-2 shrink-0">
                <div id="fullPostAuthorHeader" class="flex items-center gap-2.5 min-w-0"></div>
                <button onclick="closeFullPostModal()" class="w-8 h-8 rounded-full bg-white/10 text-white font-bold flex items-center justify-center shrink-0">✕</button>
            </div>
            <div id="fullPostScrollBody" class="p-4 overflow-y-auto space-y-3.5 flex-1"></div>
            <div class="p-3 bg-dc-950/95 border-t border-white/15 shrink-0">
                <form onsubmit="handleAddComment(event)" class="flex items-center gap-2">
                    <input type="text" id="commentInputText" required maxlength="240" placeholder="Написать комментарий..." class="flex-1 bg-dc-900 border border-white/20 rounded-xl px-3 py-2 text-xs text-white placeholder-sky-200/50 focus:outline-none focus:border-neon-pink">
                    <button type="submit" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-neon-pink to-blue-600 text-white font-display font-bold text-xs shrink-0">
                        Отправить
                    </button>
                </form>
                <div id="commentUserHint" class="text-[9px] text-sky-200/70 mt-1 px-1 flex items-center justify-between">
                    <span>Комментарий +50 Σ</span>
                    <button type="button" onclick="openPhoneAuthModal()" class="text-neon-light underline font-semibold">📱 Войти по телефону</button>
                </div>
            </div>
        </div>
    </div>
<div class="native-toast" id="native-toast" role="status" hidden></div>
</body></html>
